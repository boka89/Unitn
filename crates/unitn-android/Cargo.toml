# Android build of Unitn (experimental). Deliberately not a member of the
# workspace: it has its own lock file, so the desktop builds and their
# Cargo.lock stay exactly as they are. Build it with
# .github/scripts/android-build.sh.
[package]
name = "unitn-android"
description = "Unitn player for Android (experimental)"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
unitn = { path = "../unitn" }
# Turns on Slint's Android backend for the whole build (features are shared
# with the `unitn` crate).
slint = { version = "1.8", features = ["backend-android-activity-06"] }
# Calls into the Java side (java/net/bokors/unitn).
jni = "0.21"

[build-dependencies]
cc = "1"

[profile.release]
strip = true

# Text input with Microsoft SwiftKey: Slint's Android text bridge loses
# what SwiftKey types (slint-ui/slint#9240). Until the fix
# (slint-ui/slint#14216) is in a release, the Android build uses Slint at
# that pull request's commit.
[patch.crates-io]
slint = { git = "https://github.com/slint-ui/slint", rev = "67ee907b234c94ff890614d4fb12e7a56b273351" }
slint-build = { git = "https://github.com/slint-ui/slint", rev = "67ee907b234c94ff890614d4fb12e7a56b273351" }
